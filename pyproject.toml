[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpsc-integrity"
version = "0.0.1"
description = "Detect recurrent chromosomal abnormalities in human pluripotent stem cell cultures from bulk RNA-seq"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
